name: Docker Scout CVE Scan
on:
  # The scan reads maksimtech/mailradar:latest from Docker Hub, so it is only
  # meaningful once a new image is published — which happens on a tag, not on a
  # push to main. So it follows the workflow that pushes the image: until
  # 2026-10-24 it did not, and after a release the scan, and the Security Posture
  # gate that reads it, kept describing the image the release had replaced until
  # somebody dispatched them by hand.
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  scout:
    name: Docker Scout
    # After a push that failed, Docker Hub still has the old image: nothing to rescan.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Fetch the Scout binary with the job's token
        # docker/scout-action downloads its binary anonymously and fails with a 403
        # when the runner's shared address has spent GitHub's 60-an-hour budget
        # (docker/scout-action#116). It uses the binary when it is already in place;
        # this puts the one of the pinned version there, checked against its digest
        # (tests/test_scout_binary.py).
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fetch_scout_binary.sh e7e2a72bf1485d10a58f30696b6c513b261ce4fa v1.29.0
      - name: Docker Scout CVE scan
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          # cves says what is broken in the image and feeds the Security tab;
          # if this step fails, the job does.
          command: cves
          image: maksimtech/mailradar:latest
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Docker Scout base image recommendations
        # recommendations says whether a base image exists that fixes those
        # CVEs. On 2026-09-26 the first scan of exeradar found five HIGH CVEs,
        # all of them in python:3.14-slim-trixie and none in this project's
        # code — a fact nobody can act on without this command. It is advice:
        # from 2026-10-24 the scout CLI crashed in it (nil pointer in
        # recommendations/markdown.go) on python:3.12-slim-trixie images, and
        # run together with cves it turned every scan red. A failure here
        # shows in the log and fails nothing (tests/test_scout_steps.py).
        continue-on-error: true
        uses: docker/scout-action@e7e2a72bf1485d10a58f30696b6c513b261ce4fa # v1.29.0
        with:
          command: recommendations
          image: maksimtech/mailradar:latest
      - name: Upload Scout results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        if: always() && hashFiles('scout-results.sarif') != ''
        with:
          sarif_file: scout-results.sarif
