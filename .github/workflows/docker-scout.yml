name: Docker Scout CVE Scan
on:
  # The scan reads maksimtech/mailradar:latest from Docker Hub, so it is only
  # meaningful once a new image is published — which happens on a tag, not on a
  # push to main. So it follows the workflow that pushes the image: until
  # 2026-10-24 it did not, and after a release the scan, and the Security Posture
  # gate that reads it, kept describing the image the release had replaced until
  # somebody dispatched them by hand.
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 4 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  scout:
    name: Docker Scout
    # After a push that failed, Docker Hub still has the old image: nothing to rescan.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Docker Scout CVE scan
        uses: docker/scout-action@4bbf17a9da65a7b5497361bb407e88cc9548f69c # v1.28.0
        with:
          # cves says what is broken in the image; recommendations says
          # whether a base image exists that fixes it. On 2026-09-26 the first
          # scan of exeradar found five HIGH CVEs, all of them in
          # python:3.14-slim-trixie and none in this project's code — which is
          # a fact nobody can act on without the second command.
          command: cves,recommendations
          image: maksimtech/mailradar:latest
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Upload Scout results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && hashFiles('scout-results.sarif') != ''
        with:
          sarif_file: scout-results.sarif
