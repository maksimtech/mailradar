name: CodSpeed
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'mailradar/**'
      - 'tests/**'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  benchmarks:
    name: Run benchmarks
    # The one job left behind when the rest moved to ubuntu-26.04 on 2026-10-02,
    # and pinned rather than left on `ubuntu-latest` on purpose. CodSpeedHQ/action
    # v5 fails on 26.04 with `##[error]Unsupported system` — measured on
    # patchradar, run 37063015887, with `mode: simulation` already set and the
    # action pinned, so it is the image and nothing else.
    #
    # `ubuntu-latest` is 24.04 today, so leaving it there would work right up to
    # the day GitHub moves that label, and then break on main at a moment nobody
    # picked. 24.04 is supported until April 2029.
    #
    # Move it to 26.04 once CodSpeed supports it; nothing here will notice when
    # that happens, so it is worth trying on a branch now and then.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"  # NOSONAR - trusted internal project
          pip install pytest-codspeed --only-binary :all:
      - name: Run benchmarks
        uses: CodSpeedHQ/action@373d6868929f444bc08d901fd0eb0ad52a8875ea # v5
        with:
          mode: simulation
          run: pytest tests/benchmarks/ --codspeed
