name: Publish to PyPI
on:
  push:
    tags:
      - 'v*'
  # From a branch this is a dry run: build runs, publish and verify are skipped.
  workflow_dispatch:

# Each job asks for its own; only publish holds the token PyPI trusts
# (tests/test_publish_contract.py).
permissions: {}

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # build, hatchling and their dependencies, each pinned with its hashes and
      # compiled under the 14-day rule; Renovate keeps the file
      # (tests/test_publish_contract.py, tests/test_renovate_config.py).
      - name: Install build dependencies
        run: pip install --require-hashes -r .github/requirements-build.txt
      # Without isolation: python -m build would fetch an unpinned hatchling into
      # an environment of its own. The step above installed the pinned one.
      - name: Build package
        run: python -m build --no-isolation
      - name: Keep the distributions for publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The one job PyPI trusts: no checkout, no Python, no command of its own.
  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mailradar
    permissions:
      id-token: write
    steps:
      - name: Fetch the distributions build made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          verify-metadata: false

  verify:
    name: Check the release installs from PyPI
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # That the file on PyPI can be installed used to be proved by accident, by
      # docker.yml installing it to build the image. The image now builds from this
      # tag's source and never asks the index, so the check is made here, on purpose,
      # and after the upload — where a slow index delays a check instead of failing a
      # build that had nothing to do with it.
      #
      # No margin, and the install is asked again instead, by install_from_pypi.sh.
      # A poll that has just been answered does not mean the next request will be: on
      # apkradar 2026.48 the wait saw the version and the install three seconds later,
      # on the same runner, was refused it. A grace would not have saved it —
      # releaseradar lost on v2026.4 with 45 s.
      # The tag is a release tag or nothing, and only then normalised, with the value
      # as an argument: it was pasted into Python's code, where a ' ends the string (#192).
      - name: Extract version
        id: version
        env:
          RAW: ${{ github.ref_name }}
        run: |
          if [[ ! "$RAW" =~ ^v[0-9]+(\.[0-9]+)+$ ]]; then
            printf '::error::not a release tag: %q\n' "$RAW"
            exit 1
          fi
          NORMALIZED=$(python3 -I -c 'import sys; print(".".join(str(int(p)) for p in sys.argv[1].split(".")))' "${RAW#v}")
          echo "VERSION=${NORMALIZED}" >> "$GITHUB_OUTPUT"

      - name: Wait for the index to catch up
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: bash .github/scripts/wait_for_pypi.sh mailradar "$VERSION" 30 20 0

      - name: Check the published wheel installs and runs
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          python -m venv "${RUNNER_TEMP}/verify"
          bash .github/scripts/install_from_pypi.sh "${RUNNER_TEMP}/verify" mailradar "$VERSION" 10 30
          "${RUNNER_TEMP}/verify/bin/mailradar" --version
