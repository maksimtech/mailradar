name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14-dev"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e .  # NOSONAR - trusted internal project, no external setup scripts
      - name: Test CLI
        run: |
          mailradar --help
          mailradar check maksimtech.com
          mailradar discover maksimtech.com --no-gpg

  summary:
    # The branch ruleset requires a check named exactly "Tests". The matrix job
    # cannot provide it: its contexts carry the Python version, so they change
    # whenever the matrix does, which is how the ruleset came to require names
    # that no longer existed. This job gives the ruleset one stable name.
    # always(): a skipped required check counts as passed, so this has to run
    # even when the matrix fails, and fail explicitly in that case.
    name: Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required test job ended with: $result"; exit 1; }
          done
