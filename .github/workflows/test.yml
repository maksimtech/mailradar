name: Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        experimental: [false]
        include:
          - python-version: "3.14-dev"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # The dev extra, or pytest is not here to run the suite with.
        run: pip install -e ".[dev]"  # NOSONAR - trusted internal project, no external setup scripts

      - name: Run test suite
        # --ignore=tests/benchmarks: they import pytest-codspeed, which is not
        # in the dev extra — codspeed.yml runs them with what they need.
        run: >-
          pytest tests/ -v --ignore=tests/benchmarks
          --cov=mailradar --cov-report=xml --cov-report=term-missing

      - name: Test CLI
        # --help only. `check` and `discover` used to run here against a live
        # domain, so this check depended on DNS and on somebody else's mail
        # server; what they exercised, 368 tests exercise without the network.
        # This one still catches an import error or a broken entry point, which
        # the suite cannot: it imports the modules directly.
        run: mailradar --help

      - name: Upload coverage to Codecov
        # Once, not once per matrix entry: the same report three times is three
        # uploads of one measurement.
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          # A failed upload loses a metric, it does not invalidate the tests that
          # just passed. What it must not do is stay silent forever — ask Codecov
          # whether the report arrived.
          fail_ci_if_error: false

  summary:
    # The branch ruleset requires a check named exactly "Tests". The matrix job
    # cannot provide it: its contexts carry the Python version, so they change
    # whenever the matrix does, which is how the ruleset came to require names
    # that no longer existed. This job gives the ruleset one stable name.
    # always(): a skipped required check counts as passed, so this has to run
    # even when the matrix fails, and fail explicitly in that case.
    name: Tests
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All test jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || { echo "::error::A required test job ended with: $result"; exit 1; }
          done
