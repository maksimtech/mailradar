name: Quality
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  quality:
    # One name, not a matrix: ruff and mypy read their target version from
    # pyproject.toml, so running them on four interpreters would repeat the
    # same answer four times.
    name: Quality
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"  # NOSONAR - trusted internal project, no external setup scripts
      # `tools/` is in here because it was not, and that is where
      # security_exceptions.py lives: the script that refuses a build over an
      # unexplained alert had never been seen by the linter that gates the build.
      # Found on 2026-10-02 by running ruff over the whole tree by hand.
      - name: Lint (ruff)
        run: ruff check mailradar tests tools
      - name: Type check (mypy)
        run: mypy mailradar
      # docs/nis2-compliance.md shows uv.lock to a customer as the full list of
      # dependencies. It had gone three releases without being regenerated: on
      # 2026-10-11 `uv lock --check` refused it. The uv pinned here is the one
      # that wrote the file.
      - name: Lockfile matches pyproject.toml (uv)
        run: |
          python -m pip install "uv==0.12.18"
          uv lock --check
