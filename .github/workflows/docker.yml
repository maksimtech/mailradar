name: Build and Push Docker Image
on:
  push:
    tags:
      - 'v*'
  schedule:
    # A weekly rebuild of `latest` from the newest tag, so the image picks up
    # Debian's patches without waiting for a release.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09.4)'
        required: true
        default: 'v2026.09.4'
permissions:
  contents: read
  security-events: write
jobs:
  docker:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            RAW=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${RAW}" >> $GITHUB_OUTPUT
          STRIPPED="${RAW#v}"
          NORMALIZED=$(python3 -c "parts='${STRIPPED}'.split('.'); print('.'.join(str(int(p)) for p in parts))")
          echo "PIP_VERSION=${NORMALIZED}" >> $GITHUB_OUTPUT
      # publish.yml runs in parallel on the same tag push, so this job can reach
      # `pip install mailradar==<new version>` before the version exists at all.
      # A fixed `sleep 60` stood here; apkradar had the same one and lost the race
      # twice, on 2026-09-24 and 2026-09-30, both times reported as "No matching
      # distribution found" — which reads like a failed publish while PyPI already
      # had the files. mailradar passed on timing alone. Polling asks the question
      # the Dockerfile asks, with pip, until the index answers it.
      #
      # After the version step, not before it: the wait needs the pip version,
      # because `mailradar==v2026.41` is not a version pip can ever find.
      #
      # Only on a tag push. A scheduled rebuild and a manual dispatch both name a
      # version that was published long ago, and waiting for it would only move
      # the failure of a wrong input from the build to here.
      - name: Wait for mailradar on PyPI
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.PIP_VERSION }}
        run: bash .github/scripts/wait_for_pypi.sh mailradar "$VERSION"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The scheduled rebuild updates `latest` only: the versioned tags stay
          # as they were published with their release.
          tags: |
            maksimtech/mailradar:latest
            ${{ github.event_name != 'schedule' && format('maksimtech/mailradar:{0}', steps.version.outputs.VERSION) || '' }}
          build-args: |
            MAILRADAR_VERSION=${{ steps.version.outputs.PIP_VERSION }}
          pull: true
          # The weekly rebuild exists to pick up Debian's patches, and a cached
          # `apt-get upgrade` layer is exactly what would stop it doing that.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: maksimtech/mailradar:${{ github.event_name == 'schedule' && 'latest' || steps.version.outputs.VERSION }}
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Upload Scout SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: scout-results.sarif
