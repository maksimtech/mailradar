name: Build and Push Docker Image
on:
  push:
    tags:
      - 'v*'
  schedule:
    # Rebuild settimanale di latest dall'ultimo tag: riceve le patch Debian
    # without needing a release
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09.4)'
        required: true
        default: 'v2026.09.4'
permissions:
  contents: read
  security-events: write
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for PyPI propagation
        if: github.event_name == 'push'
        run: sleep 60
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            RAW=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${RAW}" >> $GITHUB_OUTPUT
          STRIPPED="${RAW#v}"
          NORMALIZED=$(python3 -c "parts='${STRIPPED}'.split('.'); print('.'.join(str(int(p)) for p in parts))")
          echo "PIP_VERSION=${NORMALIZED}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The scheduled rebuild updates only latest: the versioned images
          # restano quelle pubblicate con la release
          tags: |
            maksimtech/mailradar:latest
            ${{ github.event_name != 'schedule' && format('maksimtech/mailradar:{0}', steps.version.outputs.VERSION) || '' }}
          build-args: |
            MAILRADAR_VERSION=${{ steps.version.outputs.PIP_VERSION }}
          pull: true
          # The cache would reuse the apt-get upgrade layer: without Debian patches
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: maksimtech/mailradar:${{ github.event_name == 'schedule' && 'latest' || steps.version.outputs.VERSION }}
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Upload Scout SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: scout-results.sarif
