name: Build and Push Docker Image
on:
  push:
    tags:
      - 'v*'
  schedule:
    # A weekly rebuild of `latest` from the newest tag, so the image picks up
    # Debian's patches without waiting for a release.
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2026.09.4)'
        required: true
        default: 'v2026.09.4'
permissions:
  contents: read
  security-events: write
jobs:
  docker:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            RAW=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          else
            RAW="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${RAW}" >> $GITHUB_OUTPUT
          STRIPPED="${RAW#v}"
          NORMALIZED=$(python3 -c "parts='${STRIPPED}'.split('.'); print('.'.join(str(int(p)) for p in parts))")
          echo "PIP_VERSION=${NORMALIZED}" >> $GITHUB_OUTPUT
      # Stand on the tag that was just resolved. The image is built from this
      # checkout now, and the tag arrives in a different place on each of the three
      # triggers — in the ref on a tag push, in the input on a dispatch, and nowhere at
      # all on the schedule, where the step above finds it with `git tag --list`. A
      # `ref:` on the checkout cannot express the third case, because the tag is not
      # known until the tags have been fetched.
      #
      # It matters most on the schedule: `latest` is rebuilt weekly for Debian's
      # patches, and without this it would be rebuilt from whatever main holds, which
      # is how `latest` ends up carrying unreleased code under a released version's
      # name. Nothing between the build and the push would catch that.
      - name: Stand on the tag being built
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: git checkout --detach "refs/tags/${VERSION}"
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The scheduled rebuild updates `latest` only: the versioned tags stay
          # as they were published with their release.
          tags: |
            maksimtech/mailradar:latest
            ${{ github.event_name != 'schedule' && format('maksimtech/mailradar:{0}', steps.version.outputs.VERSION) || '' }}
          build-args: |
            MAILRADAR_SOURCE=local
          pull: true
          # The weekly rebuild exists to pick up Debian's patches, and a cached
          # `apt-get upgrade` layer is exactly what would stop it doing that.
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Docker Scout CVE scan
        uses: docker/scout-action@v1
        with:
          command: cves
          image: maksimtech/mailradar:${{ github.event_name == 'schedule' && 'latest' || steps.version.outputs.VERSION }}
          only-severities: critical,high
          exit-code: false
          sarif-file: scout-results.sarif
      - name: Upload Scout SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: scout-results.sarif
