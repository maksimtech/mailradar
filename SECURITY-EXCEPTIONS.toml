[[exception]]
id = "SNYK-DEBIAN13-ATTR-17678182"
source = "Snyk Container"
where = "attr 1:2.5.2-3, python slim-trixie base image"
why = """
CVE-2026-54371, and not "no fix available" as the one-line report implies: \
Debian has fixed it in unstable and forky (attr 1:2.6.0-1) and filed it no-dsa \
for trixie with the note "Will be fixed first in unstable, then point release \
update; not to be backported by individual patches" — Debian bug 1141107.

The fix is scheduled, not absent, so the only thing to do is rebuild after the \
next trixie point release. The date below is set for that: if the point release \
has happened and this is still reported, the rebuild did not happen. The flaw is \
a symlink traversal in recursive getfattr/setfattr, which mailradar never runs.
"""
review_by = "2026-11-30"

[[exception]]
id = "SNYK-DEBIAN13-ACL-17677866"
source = "Snyk Container"
where = "acl 2.3.2-2, python slim-trixie base image"
why = """
CVE-2026-54369, Debian bug 1141110, in the same position as attr above: fixed in \
unstable and forky (acl 2.4.0-1), no-dsa for trixie with the fix scheduled for a \
point release. Debian's note says why it cannot be backported piecemeal — the \
fix adds the `acl_*_at()` ABI of 2.4.0.

A local TOCTOU in recursive setfacl/chacl; mailradar calls neither.
"""
review_by = "2026-11-30"

# ─────────────────────────────────────────────────────────────────────────────
# CodeQL `py/incomplete-url-substring-sanitization`, five alerts across two test
# files. Read line by line on 2026-09-29 before being written down.
#
# The rule fires on `"something.tld" in text`, on the assumption that a hostname
# literal tested with `in` is a URL being checked. In these files the right side
# is a report mailradar just generated and the left side is the domain the report
# is about: `assert "example.com" in text`. Nothing is sanitized, and the only
# consequence of the result is whether the test passes.
#
# The check that matters is not in the tests but in the code, and it was made
# rather than assumed: mailradar compares hostnames by equality and suffix —
# discover.py:62 `name.endswith("." + domain)`, gpg.py:40
# `hostname == "keys.openpgp.org" or hostname.endswith(".openpgp.org")` — so a
# lookalike domain does not pass for the real one. Had it been a substring test
# there, these alerts would have been a fix and not an entry.
#
# An entry here is scoped to its file, so a genuine occurrence of this rule
# anywhere else still fails the build.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/test_reporter.py"
where = "test_reporter.py:46, 56, 65, 71 — assertions on the generated report"
why = """
Four assertions that the audited domain appears in the report text, one per \
language the reporter can produce, including the fallback when an unknown \
language is asked for. The subject is text generated in the same test; there is \
no URL and no sanitization.
"""
review_by = "2026-12-31"

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/benchmarks/test_bench_checker.py"
where = "test_bench_checker.py:67 — the benchmark's own assertion"
why = """
One assertion of the same shape, in a benchmark that measures how long a check \
takes. Same reasoning as tests/test_reporter.py above.
"""
review_by = "2026-12-31"

# ─────────────────────────────────────────────────────────────────────────────
# Arrived on 2026-09-30, after 2026.41 was prepared: two advisories published
# overnight against the base image, which the gate refused before the tag. That
# is the gate working — not a defect introduced here — and the two are in
# different situations, read out of the Debian security tracker with
# `patchradar debian` rather than from the scanners' one-line summaries.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-84782"
source = "Docker Scout"
where = "openssl 3.5.7-1~deb13u2 in the published image; fixed in Debian 3.5.7-1~deb13u3"
why = """
An out-of-bounds read in OpenSSL's DTLS retransmission, advisory published \
2026-09-29. Debian has already fixed it: `patchradar debian CVE-2026-84782` \
reports it resolved in trixie at openssl 3.5.7-1~deb13u3, so this is not an \
acceptance — it is a rebuild.

The Dockerfile runs `apt-get update && apt-get upgrade -y`, so the next image \
built picks the fix up with no change to this repository. Docker Scout reads the \
image published on Docker Hub, which is why the alert stays open until then. The \
short date is the check that the publish happened: if this is still here \
afterwards, either the image was not republished or the upgrade did not take.

Reachability, for what it is worth: the flaw is in DTLS, and nothing here speaks \
DTLS. mailradar opens TLS sockets over TCP to check certificates, cookieradar \
drives Chromium over HTTPS, apkradar fetches store listings over HTTPS. None of \
that is datagram TLS.
"""
review_by = "2026-10-31"

[[exception]]
id = "SNYK-DEBIAN13-GCC14-20335537"
source = "Snyk Container"
where = "gcc-14 / libstdc++6 14.2.0-19, python slim-trixie base image"
why = """
CVE-2026-102010. Open in trixie for both gcc-12 (12.4.0-5) and gcc-14 \
(14.2.0-19), with no fixed version in any suite and no Debian bug recorded — \
checked with `patchradar debian CVE-2026-102010`. So there is nothing to wait for \
and nothing to ask for: what moves a flaw in this state is evidence on the \
tracker page, https://security-tracker.debian.org/tracker/CVE-2026-102010.

Nor is it removable. Snyk names the source package `gcc-14`, and what is actually \
installed is `libstdc++6`, the C++ runtime that a long list of packages in the \
base image link against. Removing it is not an option the way the full `perl` \
would have been.
"""
review_by = "2026-12-31"


