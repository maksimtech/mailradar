# Findings that are open, known, and accepted for now — each with a reason and a
# date. `.github/workflows/security-posture.yml` reads this file: an open high or
# critical alert with no entry here fails the build, an entry past its
# `review_by` fails the build, and an entry that no longer matches anything fails
# the build too, so the record cannot drift away from the product.
#
# The rule this file exists to serve: block on everything we can fix, never block
# on an upstream flaw with no fix available — but write down why, and when that
# will be looked at again.
#
# Fields: id, where, why, review_by are required. `source` narrows an entry to one
# scanner; `path` narrows it to one file, which matters for a rule that can fire
# anywhere — an entry for a CodeQL rule without a path would excuse the next real
# occurrence of it somewhere else.
#
# Written on 2026-09-29 against the ten blocking alerts GitHub then held for this
# repository. The Debian positions were read out of the security tracker with
# `patchradar debian`, and the CodeQL ones by opening the lines.

# ─────────────────────────────────────────────────────────────────────────────
# Debian 13 (trixie) packages of the base image. `apt-get upgrade` runs at build
# time and the image is rebuilt at every release, so a fix Debian ships arrives
# here without anyone chasing it.
#
# The four below are not one case, although every scanner prints them the same
# way — "no fix available", one line, no distinction:
#
#   zlib, perl   open in bookworm, trixie, sid and forky alike, nothing
#                scheduled anywhere. Waiting is not a plan; the Debian bug is
#                where evidence goes.
#   attr, acl    already fixed in unstable, filed no-dsa for trixie *because the
#                fix comes in a point release*. That waiting ends at a dated
#                event: rebuild after it.
#
# attr has no entry since 2026-11-02, and not because it was fixed: Snyk was the
# only scanner reporting CVE-2026-54371 (Debian bug 1141107, fixed in unstable
# and forky at 1:2.6.0-1, a symlink traversal in recursive getfattr/setfattr,
# which mailradar never runs), and Snyk was retired that day
# (tests/test_workflow_set.py, RETIRED). It is still in the image until the
# trixie point release. acl is reported by Trivy now; its entry is in the Trivy
# block at the end of this file, with the reason it had under Snyk's id.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-85091"
source = "Docker Scout"
where = "zlib 1:1.3.dfsg+really1.3.1-1, python slim-trixie base image"
why = """
Debian reports no fixed version in any suite — open in bookworm, trixie, sid and \
forky, urgency not yet assigned, Debian bug 1146895. There is nothing to wait \
for and nothing to ask for; what moves a flaw in this state is evidence on that \
bug.

Nothing in this repository can close it either: the package comes from the base \
image and is rebuilt at every release. An out-of-bounds write reached through \
gzprintf; mailradar touches zlib only through Python's own module, for HTTP \
decompression of responses it requested.
"""
review_by = "2026-12-31"

[[exception]]
id = "CVE-2026-82560"
source = "Docker Scout"
where = "perl-base, python slim-trixie base image"
why = """
Open in all four suites, including sid — Debian bug 1148455, nothing scheduled. \
Scout names the *source* package `perl`, which in Debian produces both the \
removable `perl` and `perl-base`, which is Essential and which dpkg itself \
depends on. Measured inside the built patchradar image on 2026-09-29, only \
`perl-base` is installed; this image is built the same way, so the finding is \
ours to record and not ours to close.

Since 2026-10-05T12:15:49Z Docker Scout has stopped reporting it, which is why \
the gate lists this entry as settled. It is kept, and the reason is not how long \
the silence has lasted: `patchradar debian CVE-2026-82560` on 2026-10-15 still \
reports perl no-dsa in trixie at 5.40.1-6+deb13u1, no fix in any suite, Debian \
bug 1148455. The package named in `where` is still unfixed in trixie and only \
the reporting changed. Deleting a flaw that is demonstrably present because a \
scanner fell silent is the one direction this file must not drift in.
"""
review_by = "2026-12-31"

# ─────────────────────────────────────────────────────────────────────────────
# CodeQL `py/incomplete-url-substring-sanitization`, five alerts across two test
# files. Read line by line on 2026-09-29 before being written down.
#
# The rule fires on `"something.tld" in text`, on the assumption that a hostname
# literal tested with `in` is a URL being checked. In these files the right side
# is a report mailradar just generated and the left side is the domain the report
# is about: `assert "example.com" in text`. Nothing is sanitized, and the only
# consequence of the result is whether the test passes.
#
# The check that matters is not in the tests but in the code, and it was made
# rather than assumed: mailradar compares hostnames by equality and suffix —
# discover.py:62 `name.endswith("." + domain)`, gpg.py:40
# `hostname == "keys.openpgp.org" or hostname.endswith(".openpgp.org")` — so a
# lookalike domain does not pass for the real one. Had it been a substring test
# there, these alerts would have been a fix and not an entry.
#
# An entry here is scoped to its file, so a genuine occurrence of this rule
# anywhere else still fails the build.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/test_reporter.py"
where = "test_reporter.py:46, 56, 65, 71 — assertions on the generated report"
why = """
Four assertions that the audited domain appears in the report text, one per \
language the reporter can produce, including the fallback when an unknown \
language is asked for. The subject is text generated in the same test; there is \
no URL and no sanitization.
"""
review_by = "2026-12-31"

[[exception]]
id = "py/incomplete-url-substring-sanitization"
source = "CodeQL"
path = "tests/benchmarks/test_bench_checker.py"
where = "test_bench_checker.py:67 — the benchmark's own assertion"
why = """
One assertion of the same shape, in a benchmark that measures how long a check \
takes. Same reasoning as tests/test_reporter.py above.
"""
review_by = "2026-12-31"

# ─────────────────────────────────────────────────────────────────────────────
# gcc. CVE-2026-102010 arrived on 2026-09-30, after 2026.41 was prepared,
# published overnight against the base image, and the gate refused it before
# the tag — the gate working, not a defect introduced here. CVE-2026-95619
# followed on 2026-10-02. Until 2026-11-02 each had a second entry under Snyk's
# id (SNYK-DEBIAN13-GCC14-20335537, -20386241); Snyk was retired that day, and
# what those entries said lives on in the Docker Scout entries below.
#
# Positions read with `patchradar debian` rather than from the scanners' one line:
# CVE-2026-102010 and CVE-2026-95619 are both open in trixie for gcc-12 (12.4.0-5)
# and gcc-14 (14.2.0-19), with no fixed version in any suite and no Debian bug
# recorded. Nothing to wait for and nothing to ask for; evidence goes on the
# tracker page.
#
# What the scanners name is the *source* package gcc-14, and Debian's gcc source produces
# both the compiler and libstdc++6. A flaw in cc1 needs something to compile and
# nothing in this image compiles anything; which binary package is installed is a
# measurement and not an assumption, which is why tests/docker/inspect.sh prints
# the gcc and libstdc++ packages.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-102010"
source = "Docker Scout"
where = "gcc-14 / libstdc++6 14.2.0-19, python slim-trixie base image"
why = """
Open in trixie for gcc-12 (12.4.0-5) and gcc-14 (14.2.0-19), no fixed version in \
any suite, no Debian bug — `patchradar debian CVE-2026-102010`. Evidence goes on \
https://security-tracker.debian.org/tracker/CVE-2026-102010.

Nor is it removable. The scanners name the source package `gcc-14`, and what is \
actually installed is `libstdc++6`, the C++ runtime that a long list of packages \
in the base image link against. Removing it is not an option the way the full \
`perl` would have been. Recorded from 2026-09-30 under Snyk's id \
SNYK-DEBIAN13-GCC14-20335537 too, until Snyk was retired on 2026-11-02.

Since 2026-10-12T13:04:03Z Docker Scout has stopped reporting it, which is why \
the gate lists this entry as settled. It is kept, and the reason is not how long \
the silence has lasted: `patchradar debian CVE-2026-102010` on 2026-10-15 still \
reports gcc-14 no-dsa in trixie at 14.2.0-19, with the fix only in sid \
(14.4.0-3). The package named in `where` is still unfixed in trixie and only the \
reporting changed. Deleting a flaw that is demonstrably present because a \
scanner fell silent is the one direction this file must not drift in.
"""
review_by = "2026-12-31"

