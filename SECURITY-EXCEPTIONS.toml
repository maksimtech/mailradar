QUIC, client or server, and nothing in this image speaks it.
mailradar's own TLS is Python's ssl module over TCP (httpx, dnspython's DoH when \
used, and smtplib/imaplib with STARTTLS); it runs no server at all. dnspython \
would speak DNS over QUIC or HTTP/3 only with aioquic, which is not installed. \
