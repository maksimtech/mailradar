# ─────────────────────────────────────────────────────────────────────────────
# pcre2, and this one is not an acceptance at all.
# ─────────────────────────────────────────────────────────────────────────────

[[exception]]
id = "CVE-2026-103111"
source = "Docker Scout"
where = "pcre2 10.46-1~deb13u2 in the published image; fixed in Debian 10.46-1~deb13u3"
why = """
Debian has already fixed it: `patchradar debian CVE-2026-103111` reports it \
resolved in trixie at pcre2 10.46-1~deb13u3, and in sid at 10.48-3.1. So this is a \
rebuild rather than something to accept — the Dockerfile runs \
`apt-get update && apt-get upgrade -y`, and the next image built picks the fix up \
with no change to this repository.

docker.yml rebuilds `latest` every Monday with `no-cache: true`, precisely so that \
Debian's patches arrive without waiting for a release, so this closes by itself \
within the week. The short date below is the check that it did: if the alert is \
still here afterwards, either the scheduled rebuild did not run or the upgrade did \
not take.

Docker Scout's own alert text carries EPSS 0.002060 at percentile 0.095970, and \
this repository's gate computed 0.2% at p9 from FIRST directly. Two independent \
readings of the same forecast agreeing is worth recording once.
"""
review_by = "2026-10-31"
