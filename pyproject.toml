[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailradar"
dynamic = ["version"]
description = "Email security posture analyzer — DMARC, SPF, DKIM, BIMI, VMC & GPG audit tool"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Massimo Moretti", email = "massimo.moretti@maksimtech.com"},
]
keywords = ["dmarc", "spf", "dkim", "bimi", "email-security", "privacy", "gdpr", "security-audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Communications :: Email",
]
dependencies = [
    "dnspython>=2.6",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
mailradar = "mailradar.cli:app"

[project.urls]
Homepage = "https://github.com/maksimtech/mailradar"
Repository = "https://github.com/maksimtech/mailradar"
Issues = "https://github.com/maksimtech/mailradar/issues"
Changelog = "https://github.com/maksimtech/mailradar/CHANGELOG.md"

[tool.hatch.version]
path = "mailradar/__init__.py"

[tool.ruff]
line-length = 88
target-version = "py311"
