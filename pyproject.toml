[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mailradar"
dynamic = ["version"]
description = "Email security posture analyzer — DMARC, SPF, DKIM, BIMI, VMC & GPG audit tool"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "Massimo Moretti", email = "massimo.moretti@maksimtech.com"},
]
keywords = ["dmarc", "spf", "dkim", "bimi", "email-security", "privacy", "gdpr", "security-audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: Communications :: Email",
]
dependencies = [
    "dnspython>=2.6",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=1.18",
    "hypothesis>=6.140",
    "mutmut>=3.8",
    # Read by the tests that check the workflows against pyproject.toml. It
    # used to arrive on its own through mutmut -> libcst, until libcst started
    # asking for pyyaml-ft instead on Python 3.13 and `import yaml` stopped
    # resolving there — green on 3.11, 3.12 and 3.14, red on one version.
    "pyyaml>=6.0",
]

[project.scripts]
mailradar = "mailradar.cli:app"

[project.urls]
Homepage = "https://github.com/maksimtech/mailradar"
Repository = "https://github.com/maksimtech/mailradar"
Issues = "https://github.com/maksimtech/mailradar/issues"
Changelog = "https://github.com/maksimtech/mailradar/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "mailradar/__init__.py"

[tool.pytest.ini_options]
# The one pytest setting mailradar was missing. asyncio_mode is deliberately
# absent: unlike the other four Radar, mailradar has no async tests at all.
testpaths = ["tests"]
# What the workflows already pass: the benchmark runner is installed by
# codspeed.yml alone, not by the dev extra, so a bare `pytest` ended in four
# fixture errors. An explicit `pytest tests/benchmarks/` still collects them.
addopts = "--ignore=tests/benchmarks"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Useful without being noisy. The security ruleset S is deliberately absent:
# ruff's S rules *are* flake8-bandit — measured on 2026-09-24, S110 and B110
# reported the same four try-except-pass — so selecting it here would report
# every finding twice, under two ids, in two places to be archived.
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 objects to a function call in an argument default, and Typer's entire
# API is exactly that: `def cmd(x: str = typer.Option(...))`. There is no fix
# on this side — moving the call into the body would stop Typer seeing the
# option at all — so the two calls are declared immutable instead.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
# A test may import for a side effect, or redefine a fixture name to make the
# case read; neither is a defect there.
"tests/*" = ["F811", "E402"]

[tool.mypy]
python_version = "3.11"
# Permissive on purpose, not for lack of stubs: dnspython, cryptography, typer,
# rich, httpx and jinja2 all ship py.typed. The setting is kept identical across
# the five Radar so one command means the same thing everywhere.
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Tests assert against deliberately malformed input; annotating that would
# describe the fixtures rather than check the code.
module = "tests.*"
ignore_errors = true

[tool.mutmut]
source_paths = ["mailradar"]
# The benchmarks are left out, and the reason stands on its own: a benchmark
# measures speed and asserts nothing, so it can kill no mutant, and running one
# against every mutant is pure cost.
#
# It is also what broke this run on 2026-10-03. The benchmark runner is installed
# by codspeed.yml alone and is deliberately not a project dependency, so under
# mutmut the fixture was missing and the stats phase died before a single mutant
# was tried. `tests/test_benchmark_contract.py` is where that arrangement is
# written down — including the rule that the runner is not named in this file.
#
# Read only by the stats and warm-up runs; per-mutant runs get explicit test ids.
pytest_add_cli_args_test_selection = ["tests/", "--ignore=tests/benchmarks"]
# What the contract tests reach for outside the mutated source. mutmut copies
# `source_paths` into `mutants/` and runs the suite from there, adding only
# `tests/`, `test/`, `setup.cfg`, `pyproject.toml` and `uv.lock` of its own
# accord — so a test that imports from `tools/` or reads a file at the
# repository root finds nothing, and the whole run dies in the stats phase
# before a single mutant is tried. That is what happened to all five Radar on
# 2026-10-03.
#
# Verified rather than guessed: mutmut refuses to run on Windows, so the
# `mutants/` tree was rebuilt from mutmut's own copy rules and the suite run
# inside it until it passed. Add to this list when a test starts reading
# something new from the root; the Saturday run is otherwise where you find out.
also_copy = [
    "tools",
    "Dockerfile",
    ".github",
    "sonar-project.properties",
    "SECURITY-EXCEPTIONS.toml",
    "CHANGELOG.md",
    "README.md",
    "SECURITY.md",
    "release.sh",
    ".gitattributes",
]
# mutmut 3.8 refuses to run on Windows and points at WSL, so this is a CI-only
# configuration: the scheduled workflow runs it on ubuntu.
do_not_mutate = ["mailradar/__init__.py"]
